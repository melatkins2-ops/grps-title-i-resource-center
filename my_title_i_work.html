<section class="hero"><div style="font-size:.68rem;font-weight:900;color:#ffd4b3;letter-spacing:.08em">GRPS TITLE I</div><h1>My Title I Work</h1><p>Return to tools you have used recently. Progress is saved in this browser when a tool supports local saving.</p></section>
<div class="wrap"><div id="recentWrap" class="grid"></div><div id="emptyState" class="empty" style="display:none"><strong>No recent work is saved yet.</strong> Start with a task. As you use supported tools, this page becomes your return point.</div><div style="margin-top:14px"><a class="btn" href="task_start.html">Choose a task →</a> <button class="btn" onclick="clearRecent()">Clear recent history</button></div></div>
<script>
const tools=[
["Monthly Title I Review","continuous_improvement_action_center.html","grps_title_i_monthly_review"],
["Can Title I Pay for This?","guided_purchase.html","grps_title_i_purchase"],
["Plan a Family Engagement Activity","guided_family_engagement.html","grps_title_i_family"],
["Plan the Annual Title I Meeting","guided_annual_meeting.html","grps_title_i_annual"],
["Title I-Funded Staff","staffing_documentation_hub.html","grps_title_i_staffing"],
["Get Ready for a Title I Review","guided_onsite_review.html","grps_title_i_review"]
];
function loadRecent(){
 const wrap=document.getElementById("recentWrap"); wrap.innerHTML=""; let n=0;
 tools.forEach(function(item){
   const title=item[0], file=item[1], key=item[2], raw=localStorage.getItem(key);
   if(raw){
     n++; let d={}; try{d=JSON.parse(raw)}catch(e){}
     const touched=d.updatedAt||d.savedAt||"Saved in this browser";
     const card=document.createElement("div"); card.className="card";
     card.innerHTML="<h2>"+title+"</h2><div class='small'>Saved work found • "+touched+"</div><a class='btn' href='"+file+"'>Continue →</a>";
     wrap.appendChild(card);
   }
 });
 document.getElementById("emptyState").style.display=n?"none":"block";
}
function clearRecent(){tools.forEach(function(x){localStorage.removeItem(x[2])});loadRecent();}
loadRecent();
</script><a class="global-work-v71" href="my_title_i_work.html">My Work</a><a class="global-help-v71" href="quick_help.html">Quick Help</a><a class="global-home-v71" href="index.html" aria-label="Home" title="Home">⌂</a></body></html>
